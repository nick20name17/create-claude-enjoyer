<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>claude-enjoyer</title>
    <!-- @scaffolder:dark-mode-init -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'system'
          var dark =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.classList.toggle('light', !dark)
        } catch (e) {}
      })()
    </script>
    <!-- /@scaffolder:dark-mode-init -->
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
